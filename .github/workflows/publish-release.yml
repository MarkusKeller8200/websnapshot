name: Publish WebSnapshot release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"

      - name: Validate source and run tests
        run: |
          python -m compileall -q src tests
          python -m pytest -q

      - name: Resolve current version
        id: release
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test -f "docs/releases/v${VERSION}.md" || { echo "Missing release notes for v${VERSION}" >&2; exit 1; }
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish documented releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # One retroactive, clearly labelled consolidated release for the
          # existing 0.6.x work before the navigation redesign.
          if ! gh release view v0.6.3 >/dev/null 2>&1; then
            gh release create v0.6.3 \
              --target 075be4e7cc093dd25a5777aca4c210197fde4972 \
              --title "WebSnapshot v0.6.3 – konsolidierter Entwicklungsstand" \
              --notes-file docs/releases/v0.6.3.md
          fi
          if ! gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release create "$CURRENT_TAG" \
              --target "$GITHUB_SHA" \
              --title "WebSnapshot $CURRENT_TAG" \
              --notes-file "docs/releases/$CURRENT_TAG.md"
          else
            echo "$CURRENT_TAG already exists; no release changed."
          fi
