[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "websnapshot"
version = "0.6.5"
description = "Manual local website snapshots and change reports"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["streamlit>=1.38,<2", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "playwright>=1.55,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
